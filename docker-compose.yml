services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres   # local development only
      POSTGRES_DB: support
    ports:
      - "5433:5432"                 # 5433 so it never clashes with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
